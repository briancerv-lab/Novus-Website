<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgComm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F252B" />
      <stop offset="100%" stop-color="#2D3843" />
    </linearGradient>
    <linearGradient id="glassPartition" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A6074" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#26333F" stop-opacity="0.65" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgComm)" />
  <!-- Acoustic Baffle Ceiling System -->
  <g fill="#8C6D46" opacity="0.85">
    <rect x="80" y="40" width="640" height="10" />
    <rect x="110" y="64" width="580" height="10" />
    <rect x="140" y="88" width="520" height="10" />
  </g>
  <!-- Linear Architectural LED Lighting -->
  <rect x="180" y="54" width="180" height="5" fill="#FFF8E7" />
  <rect x="440" y="54" width="180" height="5" fill="#FFF8E7" />
  <!-- Aluminum & Glass Partition Office Storefront -->
  <rect x="90" y="135" width="410" height="335" fill="url(#glassPartition)" stroke="#D9DEE3" stroke-width="4" />
  <line x1="205" y1="135" x2="205" y2="470" stroke="#D9DEE3" stroke-width="3" />
  <line x1="320" y1="135" x2="320" y2="470" stroke="#D9DEE3" stroke-width="3" />
  <line x1="415" y1="135" x2="415" y2="470" stroke="#D9DEE3" stroke-width="3" />
  <line x1="90" y1="400" x2="320" y2="400" stroke="#D9DEE3" stroke-width="2" />
  <!-- Architectural Wood Slat Feature Wall & Reception Desk (Right) -->
  <rect x="530" y="135" width="180" height="335" fill="#34424F" stroke="#46525D" stroke-width="2" />
  <g fill="#A66B3E">
    <rect x="546" y="145" width="10" height="315" />
    <rect x="568" y="145" width="10" height="315" />
    <rect x="590" y="145" width="10" height="315" />
    <rect x="612" y="145" width="10" height="315" />
    <rect x="634" y="145" width="10" height="315" />
    <rect x="656" y="145" width="10" height="315" />
    <rect x="678" y="145" width="10" height="315" />
  </g>
  <!-- Commercial Reception Millwork Counter -->
  <rect x="450" y="365" width="230" height="105" fill="#F5F4F0" stroke="#D9DEE3" stroke-width="2" />
  <rect x="470" y="385" width="190" height="65" fill="#1F252B" />
  <line x1="470" y1="395" x2="660" y2="395" stroke="#F28C28" stroke-width="3" />
  <!-- Polished Concrete Floor -->
  <rect x="0" y="470" width="800" height="130" fill="#28313A" />
  <line x1="0" y1="470" x2="800" y2="470" stroke="#D9DEE3" stroke-width="2" opacity="0.4" />
  <line x1="260" y1="470" x2="180" y2="600" stroke="#1F252B" stroke-width="2" />
  <line x1="540" y1="470" x2="620" y2="600" stroke="#1F252B" stroke-width="2" />
</svg>
