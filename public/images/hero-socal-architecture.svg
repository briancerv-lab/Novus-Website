<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A222B" />
      <stop offset="55%" stop-color="#2B3844" />
      <stop offset="100%" stop-color="#4A555E" />
    </linearGradient>
    <linearGradient id="warmGlow" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#F28C28" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#C88A4B" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#1F252B" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="stuccoLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAE6DF" />
      <stop offset="100%" stop-color="#D5CFC5" />
    </linearGradient>
    <linearGradient id="stuccoShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2BCB2" />
      <stop offset="100%" stop-color="#9E988E" />
    </linearGradient>
    <linearGradient id="warmInterior" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCE3B8" />
      <stop offset="40%" stop-color="#F2B46D" />
      <stop offset="100%" stop-color="#BA7336" />
    </linearGradient>
    <linearGradient id="cedarSoffit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C5830" />
      <stop offset="50%" stop-color="#A66B3E" />
      <stop offset="100%" stop-color="#6E4322" />
    </linearGradient>
    <linearGradient id="concretePatio" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#363E45" />
      <stop offset="100%" stop-color="#1F252B" />
    </linearGradient>
    <pattern id="archGrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#FFFFFF" stroke-width="0.6" stroke-opacity="0.06" />
    </pattern>
  </defs>

  <!-- Twilight Southern California Sky -->
  <rect width="1600" height="900" fill="url(#sky)" />
  <rect width="1600" height="900" fill="url(#warmGlow)" />
  <rect width="1600" height="900" fill="url(#archGrid)" />

  <!-- Distant San Gabriel / Box Springs Foothills Silhouette -->
  <path d="M0 560 L220 475 L450 510 L760 430 L1080 485 L1360 440 L1600 490 L1600 660 L0 660 Z" fill="#1E262E" opacity="0.7" />
  <path d="M0 590 L340 520 L680 555 L1020 495 L1390 535 L1600 515 L1600 660 L0 660 Z" fill="#182026" opacity="0.9" />

  <!-- Architectural Elevation Construction Lines -->
  <g stroke="#D9DEE3" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="6 6">
    <line x1="180" y1="120" x2="180" y2="820" />
    <line x1="680" y1="120" x2="680" y2="820" />
    <line x1="1120" y1="120" x2="1120" y2="820" />
    <line x1="1420" y1="120" x2="1420" y2="820" />
    <line x1="100" y1="260" x2="1500" y2="260" />
    <line x1="100" y1="430" x2="1500" y2="430" />
  </g>

  <!-- Main Two-Story Residence Volume (Left / Center) -->
  <!-- Upper Level Cantilever -->
  <rect x="240" y="260" width="660" height="190" fill="url(#stuccoLight)" />
  <rect x="900" y="260" width="90" height="190" fill="url(#stuccoShadow)" />
  <!-- Cedar Soffit Overhang -->
  <polygon points="220,260 920,260 900,278 240,278" fill="url(#cedarSoffit)" />
  <polygon points="220,442 920,442 900,456 240,456" fill="url(#cedarSoffit)" />

  <!-- Upper Clerestory & Architectural Glazing -->
  <rect x="290" y="295" width="240" height="120" fill="url(#warmInterior)" stroke="#1F252B" stroke-width="8" />
  <line x1="370" y1="295" x2="370" y2="415" stroke="#1F252B" stroke-width="5" />
  <line x1="450" y1="295" x2="450" y2="415" stroke="#1F252B" stroke-width="5" />

  <rect x="570" y="295" width="280" height="120" fill="url(#warmInterior)" stroke="#1F252B" stroke-width="8" />
  <line x1="663" y1="295" x2="663" y2="415" stroke="#1F252B" stroke-width="5" />
  <line x1="756" y1="295" x2="756" y2="415" stroke="#1F252B" stroke-width="5" />

  <!-- Ground Level Residence Volume -->
  <rect x="180" y="450" width="760" height="220" fill="url(#stuccoLight)" />
  <rect x="940" y="450" width="70" height="220" fill="url(#stuccoShadow)" />

  <!-- Ground Floor Great Room Multi-Slide Glass Doors -->
  <rect x="250" y="480" width="460" height="190" fill="url(#warmInterior)" stroke="#1F252B" stroke-width="10" />
  <!-- Interior Architectural Details (Kitchen Island & Pendant Silhouette) -->
  <rect x="310" y="605" width="220" height="55" fill="#2A2420" opacity="0.85" />
  <line x1="370" y1="480" x2="370" y2="535" stroke="#1F252B" stroke-width="2" />
  <circle cx="370" cy="540" r="6" fill="#FFF8E7" />
  <line x1="460" y1="480" x2="460" y2="535" stroke="#1F252B" stroke-width="2" />
  <circle cx="460" cy="540" r="6" fill="#FFF8E7" />
  <!-- Mullions -->
  <line x1="365" y1="480" x2="365" y2="670" stroke="#1F252B" stroke-width="6" />
  <line x1="480" y1="480" x2="480" y2="670" stroke="#1F252B" stroke-width="6" />
  <line x1="595" y1="480" x2="595" y2="670" stroke="#1F252B" stroke-width="6" />

  <!-- Detached Modern ADU / Studio Volume (Right) -->
  <rect x="1050" y="420" width="370" height="250" fill="url(#stuccoLight)" />
  <rect x="1420" y="420" width="55" height="250" fill="url(#stuccoShadow)" />
  <polygon points="1030,420 1445,420 1420,436 1050,436" fill="url(#cedarSoffit)" />
  <rect x="1095" y="465" width="275" height="205" fill="url(#warmInterior)" stroke="#1F252B" stroke-width="8" />
  <line x1="1185" y1="465" x2="1185" y2="670" stroke="#1F252B" stroke-width="5" />
  <line x1="1275" y1="465" x2="1275" y2="670" stroke="#1F252B" stroke-width="5" />

  <!-- Steel & Timber Breezeway Pergola Connecting Main Residence & ADU -->
  <rect x="935" y="455" width="120" height="12" fill="#1F252B" />
  <g fill="#8C5830">
    <rect x="948" y="467" width="8" height="6" />
    <rect x="966" y="467" width="8" height="6" />
    <rect x="984" y="467" width="8" height="6" />
    <rect x="1002" y="467" width="8" height="6" />
    <rect x="1020" y="467" width="8" height="6" />
    <rect x="1038" y="467" width="8" height="6" />
  </g>

  <!-- Architectural Concrete Flatwork & Forecourt -->
  <polygon points="0,670 1600,670 1600,900 0,900" fill="url(#concretePatio)" />
  <!-- Concrete Sawcut Joint Lines -->
  <g stroke="#181D22" stroke-width="2" opacity="0.7">
    <line x1="250" y1="670" x2="80" y2="900" />
    <line x1="580" y1="670" x2="500" y2="900" />
    <line x1="910" y1="670" x2="940" y2="900" />
    <line x1="1240" y1="670" x2="1380" y2="900" />
    <line x1="0" y1="735" x2="1600" y2="735" />
    <line x1="0" y1="815" x2="1600" y2="815" />
  </g>

  <!-- Warm Interior Light Spill on Patio -->
  <polygon points="250,670 710,670 780,790 190,790" fill="#F28C28" opacity="0.14" />
  <polygon points="1095,670 1370,670 1430,780 1060,780" fill="#F28C28" opacity="0.12" />

  <!-- Subtle Architectural Elevation Callouts -->
  <g fill="#D9DEE3" fill-opacity="0.45" font-family="monospace" font-size="11">
    <text x="245" y="245">EL. +22'-6" ROOF PARAPET</text>
    <text x="1055" y="405">EL. +12'-0" DETACHED ADU</text>
    <text x="1425" y="655">FIN. GRADE 0'-0"</text>
  </g>
</svg>
