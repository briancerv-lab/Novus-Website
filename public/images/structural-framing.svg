<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgStruct" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34424F" />
      <stop offset="100%" stop-color="#1F252B" />
    </linearGradient>
    <linearGradient id="timber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D7A168" />
      <stop offset="100%" stop-color="#B57E46" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgStruct)" />
  <!-- Blueprint Grid Overlay -->
  <g stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="600" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="500" y1="0" x2="500" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
    <line x1="700" y1="0" x2="700" y2="600" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="500" x2="800" y2="500" />
  </g>
  <!-- Concrete Foundation Stem Wall & Footing -->
  <rect x="90" y="450" width="620" height="50" fill="#8D959C" stroke="#D9DEE3" stroke-width="2" />
  <!-- Structural Framing Wall & Glulam Header -->
  <!-- Top Double Plate -->
  <rect x="110" y="190" width="580" height="22" fill="url(#timber)" stroke="#5E3D1C" stroke-width="1.5" />
  <!-- Gable / Shed Roof Rafters -->
  <polygon points="90,190 420,95 710,190 680,190 420,115 120,190" fill="url(#timber)" stroke="#5E3D1C" stroke-width="1.5" />
  <!-- Engineered Glulam Header Beam -->
  <rect x="230" y="212" width="340" height="44" fill="#BA7A3C" stroke="#5E3D1C" stroke-width="2" />
  <!-- Stud Framing at 16" O.C. -->
  <g fill="url(#timber)" stroke="#5E3D1C" stroke-width="1.5">
    <rect x="110" y="212" width="16" height="238" />
    <rect x="165" y="212" width="16" height="238" />
    <rect x="214" y="212" width="16" height="238" />
    <rect x="230" y="256" width="14" height="194" />
    <rect x="556" y="256" width="14" height="194" />
    <rect x="570" y="212" width="16" height="238" />
    <rect x="622" y="212" width="16" height="238" />
    <rect x="674" y="212" width="16" height="238" />
  </g>
  <!-- Steel Moment Frame / Hold-Down Hardware Callouts -->
  <rect x="212" y="405" width="20" height="45" fill="#F28C28" />
  <rect x="568" y="405" width="20" height="45" fill="#F28C28" />
  <!-- Dimension Callout Line -->
  <line x1="110" y1="535" x2="690" y2="535" stroke="#F28C28" stroke-width="2" />
  <line x1="110" y1="525" x2="110" y2="545" stroke="#F28C28" stroke-width="2" />
  <line x1="690" y1="525" x2="690" y2="545" stroke="#F28C28" stroke-width="2" />
  <text x="330" y="558" fill="#F5F4F0" font-family="monospace" font-size="13">STRUCTURAL FRAMING &amp; ADU ADDITION</text>
</svg>
